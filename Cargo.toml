[package]
name = "corvus_plugin_nuttx_console"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false
repository = "https://github.com/M-BSquared/corvus-nuttx-console"
description = "The NuttX Console plugin of Corvus GCS"

# Built inside a Corvus GCS checkout, at plugins/nuttx-console: the crate is a
# member of that workspace and takes its dependency versions from it.
[dependencies]
corvus_api = { path = "../../src/api" }
eframe = { workspace = true }
serde_json = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

# Published as a shared library that Settings installs, not compiled into the program.
[package.metadata.corvus]
loadable = true
name = "NuttX Console"
description = "The PX4 NuttShell (NSH) over MAVLink, as a console and as a terminal"
icon = "square-terminal"
version = "2.0.0"
