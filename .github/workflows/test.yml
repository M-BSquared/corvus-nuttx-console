# The plugin's tests. The plugin is a crate of the Corvus GCS workspace, so
# they run inside a Corvus GCS checkout with this repository at
# plugins/nuttx-console.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: M-BSquared/CorvusGCS
          path: corvus
      - uses: actions/checkout@v5
        with:
          path: corvus/plugins/nuttx-console
      - name: Install the libraries the interface links
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: corvus -> target
      - name: Run the tests
        working-directory: corvus
        run: cargo test --locked -p corvus_plugin_nuttx_console
      - name: Lint
        working-directory: corvus
        run: cargo clippy --locked -p corvus_plugin_nuttx_console --all-targets -- -D warnings
