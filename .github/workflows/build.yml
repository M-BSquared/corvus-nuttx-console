# Tests this plugin, builds it as a WebAssembly module with the oldest Corvus GCS it names in
# plugin.json, and publishes it to the release "plugin" of this repository, which is where
# Corvus GCS installs it from. The work is described in the workflow this one calls.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    uses: M-BSquared/CorvusGCS/.github/workflows/plugin.yml@master
    with:
      id: nuttx-console
